apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-price-ui
  labels:
    app: flight-price-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-price-ui
  template:
    metadata:
      labels:
        app: flight-price-ui
    spec:
      containers:
        - name: flight-price-ui
          image: flight-price-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7860
---
apiVersion: v1
kind: Service
metadata:
  name: flight-price-ui-service
spec:
  type: NodePort
  selector:
    app: flight-price-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 7860
      nodePort: 30037
